<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1093" width="900" height="1093" role="img" aria-label="Profissional de salao com o NODRI na mao">
  <title>Profissional de salao usando o NODRI</title>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafd"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="espelho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edf7"/>
    </linearGradient>
    <!-- userSpaceOnUse e obrigatorio: no padrao cada forma remapeia o gradiente
         para a propria caixa, e pescoco e cabeca saem em tons diferentes -->
    <linearGradient id="figura" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="1010">
      <stop offset="0" stop-color="#173a68"/>
      <stop offset="1" stop-color="#0c2650"/>
    </linearGradient>
    <filter id="cartao" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d2a56" flood-opacity="0.13"/>
    </filter>
    <filter id="aparelho" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d2a56" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="900" height="1093" fill="url(#fundo)"/>

  <!-- circulos fora de foco: profundidade sem pedir leitura -->
  <circle cx="716" cy="222" r="170" fill="#00b5d8" opacity="0.09"/>
  <circle cx="140" cy="806" r="128" fill="#0d2a56" opacity="0.05"/>

  <!-- tesoura em traco: diz "salao" no canto vazio, sem escrever a palavra -->
  <g fill="none" stroke="#00b5d8" stroke-width="6" stroke-linecap="round" opacity="0.34">
    <circle cx="139" cy="278" r="20"/>
    <circle cx="117" cy="250" r="20"/>
    <path d="M139 278 L280 133"/>
    <path d="M117 250 L296 155"/>
  </g>
  <circle cx="219" cy="196" r="5" fill="#00b5d8" opacity="0.34"/>

  <rect x="0" y="1000" width="900" height="93" fill="#e3ebf5"/>

  <!-- espelho de estacao: a arcada e o que situa a cena no salao -->
  <path d="M250 1000 L250 400 A200 200 0 0 1 650 400 L650 1000 Z" fill="url(#espelho)"/>
  <path d="M250 1000 L250 400 A200 200 0 0 1 650 400 L650 1000" fill="none" stroke="#00b5d8" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M286 1000 L286 404 A164 164 0 0 1 614 404 L614 1000" fill="none" stroke="#0d2a56" stroke-opacity="0.09" stroke-width="2"/>

  <ellipse cx="442" cy="1000" rx="188" ry="16" fill="#0d2a56" opacity="0.10"/>

  <!-- a figura e o aparelho crescem juntos, ancorados no chao (y=1000),
       senao ela flutua acima da base do espelho -->
  <g transform="translate(442 1000) scale(1.1) translate(-442 -1000)">
  <!-- a profissional, em silhueta: elegante e de qualquer salao, nao de um so -->
  <g fill="url(#figura)">
    <circle cx="382" cy="458" r="27"/>
    <circle cx="442" cy="500" r="64"/>
    <path d="M420 552 L420 606 Q442 628 464 606 L464 552 Z"/>
    <path d="M348 1000 C344 790 358 690 404 634 Q422 622 442 646 Q462 622 480 634 C526 690 540 790 536 1000 Z"/>
    <path d="M470 628 Q566 620 620 576 L656 608 Q604 682 486 696 Z"/>
    <path d="M618 582 Q646 560 680 580 Q694 600 672 616 Q638 632 616 610 Z"/>
  </g>
  <!-- gola do avental: quebra a mancha escura do busto -->
  <path d="M418 616 L442 674 L466 616 L480 634 L442 706 L404 634 Z" fill="#00b5d8" opacity="0.92"/>
  <circle cx="494" cy="548" r="9" fill="none" stroke="#00b5d8" stroke-width="4"/>

  <!-- o sistema na mao dela -->
  <g transform="rotate(-16 700 580)" filter="url(#aparelho)">
    <rect x="646" y="482" width="118" height="196" rx="17" fill="#ffffff"/>
    <rect x="658" y="502" width="94" height="156" rx="9" fill="#0d2a56"/>
    <rect x="670" y="520" width="46" height="8" rx="4" fill="#00b5d8"/>
    <rect x="670" y="540" width="70" height="6" rx="3" fill="#ffffff" opacity="0.30"/>
    <rect x="670" y="556" width="52" height="6" rx="3" fill="#ffffff" opacity="0.18"/>
    <path d="M670 608 L688 592 L706 600 L740 574" fill="none" stroke="#00b5d8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="670" y="626" width="70" height="18" rx="9" fill="#00b5d8"/>
  </g>
  <!-- os dedos por cima do aparelho, senao ele parece flutuar -->
  <path d="M636 572 Q660 556 682 570 Q694 588 674 604 Q650 618 634 600 Z" fill="url(#figura)"/>
  </g>

  <!-- dois numeros. so dois: a pagina ja tem texto demais -->
  <g filter="url(#cartao)">
    <rect x="52" y="330" width="252" height="112" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="86" cy="370" r="7" fill="#00b5d8"/>
  <text x="104" y="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b80">Agenda de hoje</text>
  <text x="84" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#0d2a56">38 clientes</text>

  <g filter="url(#cartao)">
    <rect x="592" y="742" width="272" height="132" rx="20" fill="#ffffff"/>
  </g>
  <text x="622" y="780" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b80">Dinheiro parado</text>
  <text x="622" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="35" font-weight="800" fill="#0d2a56">R$ 96.400</text>
  <path d="M622 852 C660 848 678 830 706 836 S776 812 834 798" fill="none" stroke="#00b5d8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="834" cy="798" r="6" fill="#00b5d8"/>
</svg>
