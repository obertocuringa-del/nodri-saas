<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 906" width="840" height="906" role="img"
     aria-label="Painel do salão NODRI: faturamento, ticket médio, clientes, dinheiro parado em clientes inativos, ponto de equilíbrio, NPS e metas da equipe">
  <defs>
    <style>
      .f  { font-family: "Segoe UI", Inter, system-ui, -apple-system, Arial, sans-serif; }
      .rot{ font-size:11px; fill:#8b95a5; letter-spacing:.2px }
      .big{ font-size:23px; font-weight:800; fill:#0d2a56 }
      .med{ font-size:17px; font-weight:800; fill:#0d2a56 }
      .up { font-size:10.5px; font-weight:700; fill:#12a150 }
      .ttl{ font-size:12.5px; font-weight:800; fill:#0d2a56 }
      .sm { font-size:11px; fill:#5b6675 }
    </style>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a56"/><stop offset="1" stop-color="#164a86"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d2a56" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="838" height="904" rx="18" fill="#f7fafc" stroke="#e3e8f0"/>

  <!-- barra da janela -->
  <circle cx="28" cy="30" r="4.5" fill="#e2574c"/>
  <circle cx="44" cy="30" r="4.5" fill="#f5c451"/>
  <circle cx="60" cy="30" r="4.5" fill="#5cb85c"/>
  <text class="f rot" x="76" y="34">Painel do salão · Agosto/2026</text>
  <rect x="676" y="20" width="144" height="21" rx="10" fill="#e6f8fb"/>
  <circle cx="690" cy="30.5" r="3.2" fill="#00b5d8"/>
  <text class="f" x="699" y="34" font-size="10.5" font-weight="700" fill="#0b7f96">atualizado agora</text>

  <!-- ─────────── 6 indicadores numa tela só ─────────── -->
  <g filter="url(#sombra)">
    <rect x="20" y="52" width="258" height="76" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="291" y="52" width="258" height="76" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="562" y="52" width="258" height="76" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="20" y="138" width="258" height="76" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="291" y="138" width="258" height="76" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="562" y="138" width="258" height="76" rx="12" fill="#fff" stroke="#e3e8f0"/>
  </g>

  <text class="f rot" x="38" y="74">Faturamento total</text>
  <text class="f big" x="38" y="100">R$ 128.750</text>
  <text class="f up"  x="38" y="117">▲ 18% vs. mês anterior</text>

  <text class="f rot" x="309" y="74">Ticket médio</text>
  <text class="f big" x="309" y="100">R$ 246,56</text>
  <text class="f up"  x="309" y="117">▲ 8% no período</text>

  <text class="f rot" x="580" y="74">Clientes atendidos</text>
  <text class="f big" x="580" y="100">522</text>
  <text class="f up"  x="580" y="117">▲ 46 vs. mês anterior</text>

  <text class="f rot" x="38" y="160">Clientes novos</text>
  <text class="f big" x="38" y="186">63</text>
  <text class="f" x="38" y="203" font-size="10.5" font-weight="700" fill="#0b7f96">12% da base do mês</text>

  <text class="f rot" x="309" y="160">Fat. serviços</text>
  <text class="f big" x="309" y="186">R$ 104.180</text>
  <text class="f" x="309" y="203" font-size="10.5" fill="#8b95a5">81% do total</text>

  <text class="f rot" x="580" y="160">Fat. produtos</text>
  <text class="f big" x="580" y="186">R$ 24.570</text>
  <text class="f" x="580" y="203" font-size="10.5" fill="#8b95a5">19% do total</text>

  <!-- ─────────── O DINHEIRO QUE JÁ É SEU ─────────── -->
  <g filter="url(#sombra)">
    <rect x="20" y="228" width="800" height="126" rx="14" fill="url(#ouro)"/>
  </g>
  <rect x="20" y="228" width="5" height="126" rx="2.5" fill="#00b5d8"/>
  <text class="f" x="44" y="256" font-size="11" font-weight="700" fill="#7fd9ee" letter-spacing=".8">DINHEIRO PARADO NA SUA PRÓPRIA CARTEIRA</text>
  <text class="f" x="44" y="296" font-size="38" font-weight="800" fill="#ffffff">R$ 96.400</text>
  <text class="f" x="44" y="325" font-size="13" fill="#c3d7f0">em 187 clientes que sumiram há mais de 60 dias</text>
  <text class="f" x="44" y="344" font-size="11.5" fill="#8fb2dc">O sistema encontra, calcula o valor e monta a mensagem de retorno.</text>

  <rect x="596" y="268" width="200" height="46" rx="23" fill="#00b5d8"/>
  <text class="f" x="696" y="296" font-size="14" font-weight="800" fill="#04222e" text-anchor="middle">Recuperar no WhatsApp</text>
  <text class="f" x="696" y="332" font-size="10.5" fill="#8fb2dc" text-anchor="middle">1 clique · mensagem pronta</text>

  <!-- ─────────── Ponto de equilíbrio ─────────── -->
  <g filter="url(#sombra)">
    <rect x="20" y="366" width="394" height="160" rx="14" fill="#fff" stroke="#e3e8f0"/>
  </g>
  <text class="f ttl" x="40" y="392">Ponto de equilíbrio do mês</text>
  <text class="f sm"  x="40" y="411">Quanto o salão precisa faturar para não ter prejuízo</text>
  <text class="f" x="40" y="447" font-size="26" font-weight="800" fill="#0d2a56">R$ 84.300</text>
  <text class="f" x="40" y="466" font-size="11" font-weight="700" fill="#12a150">já superado — lucro real de R$ 44.450</text>
  <!-- A barra é o FATURADO; o risco escuro marca onde fica o ponto de
       equilíbrio (65% do que entrou). Verde passando da marca = mês no lucro. -->
  <rect x="40" y="482" width="354" height="9" rx="4.5" fill="#eef2f7"/>
  <rect x="40" y="482" width="354" height="9" rx="4.5" fill="#12a150"/>
  <rect x="270" y="476" width="2.5" height="21" rx="1.2" fill="#0d2a56"/>
  <text class="f" x="40" y="510" font-size="10" fill="#8b95a5">faturado: R$ 128.750</text>
  <text class="f" x="394" y="510" font-size="10" fill="#0d2a56" font-weight="700" text-anchor="end">▲ ponto de equilíbrio</text>

  <!-- ─────────── Satisfação ─────────── -->
  <g filter="url(#sombra)">
    <rect x="426" y="366" width="394" height="160" rx="14" fill="#fff" stroke="#e3e8f0"/>
  </g>
  <text class="f ttl" x="446" y="392">Satisfação do cliente</text>
  <text class="f sm"  x="446" y="411">Pesquisa própria, com convite ao Google</text>

  <circle cx="500" cy="464" r="38" fill="none" stroke="#eef2f7" stroke-width="9"/>
  <circle cx="500" cy="464" r="38" fill="none" stroke="#12a150" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="203 239" transform="rotate(-90 500 464)"/>
  <text class="f" x="500" y="461" font-size="22" font-weight="800" fill="#0d2a56" text-anchor="middle">85</text>
  <text class="f" x="500" y="477" font-size="9.5" fill="#8b95a5" text-anchor="middle">NPS</text>

  <text class="f" x="562" y="443" font-size="12" fill="#5b6675">Nota média</text>
  <text class="f" x="800" y="443" font-size="13" font-weight="800" fill="#0d2a56" text-anchor="end">9,6 / 10</text>
  <text class="f" x="562" y="470" font-size="12" fill="#5b6675">Taxa de retorno</text>
  <text class="f" x="800" y="470" font-size="13" font-weight="800" fill="#12a150" text-anchor="end">98%</text>
  <text class="f" x="562" y="497" font-size="12" fill="#5b6675">Serviço crítico</text>
  <text class="f" x="800" y="497" font-size="12.5" font-weight="800" fill="#e2574c" text-anchor="end">Maquiagem 4,3</text>

  <!-- ─────────── Equipe ─────────── -->
  <g filter="url(#sombra)">
    <rect x="20" y="538" width="800" height="184" rx="14" fill="#fff" stroke="#e3e8f0"/>
  </g>
  <text class="f ttl" x="40" y="566">Metas da equipe — geradas automaticamente</text>
  <text class="f sm"  x="40" y="584">Cada profissional com a meta do dia, sem você calcular nada</text>

  <text class="f" x="40" y="616" font-size="12" font-weight="700" fill="#0d2a56">Juliana</text>
  <text class="f" x="800" y="616" font-size="12" font-weight="800" fill="#12a150" text-anchor="end">92% da meta</text>
  <rect x="40" y="623" width="760" height="8" rx="4" fill="#eef2f7"/>
  <rect x="40" y="623" width="699" height="8" rx="4" fill="#12a150"/>

  <text class="f" x="40" y="659" font-size="12" font-weight="700" fill="#0d2a56">Fernanda</text>
  <text class="f" x="800" y="659" font-size="12" font-weight="800" fill="#00b5d8" text-anchor="end">74% da meta</text>
  <rect x="40" y="666" width="760" height="8" rx="4" fill="#eef2f7"/>
  <rect x="40" y="666" width="562" height="8" rx="4" fill="#00b5d8"/>

  <text class="f" x="40" y="702" font-size="12" font-weight="700" fill="#0d2a56">Camila</text>
  <text class="f" x="800" y="702" font-size="12" font-weight="800" fill="#e8a33d" text-anchor="end">48% da meta</text>
  <rect x="40" y="709" width="760" height="8" rx="4" fill="#eef2f7"/>
  <rect x="40" y="709" width="365" height="8" rx="4" fill="#e8a33d"/>

  <!-- ─────────── O que so existe aqui ───────────
       Metas, faturamento e ticket medio todo sistema de salao mostra. Estes
       tres nao: guia do MEI da equipe, rotina que roda sem o dono presente e
       margem por servico. E o que separa um sistema de agenda de um sistema
       de gestao — e por isso ganham lugar na arte. -->
  <line x1="20" y1="742" x2="820" y2="742" stroke="#e3e8f0" stroke-width="1"/>
  <text class="f" x="20" y="770" font-size="11" font-weight="800" fill="#0b7f96" letter-spacing=".8">SÓ NO NODRI</text>

  <g filter="url(#sombra)">
    <rect x="20" y="782" width="258" height="104" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="291" y="782" width="258" height="104" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="562" y="782" width="258" height="104" rx="12" fill="#fff" stroke="#e3e8f0"/>
  </g>
  <rect x="20" y="782" width="258" height="4" rx="2" fill="#00b5d8"/>
  <rect x="291" y="782" width="258" height="4" rx="2" fill="#00b5d8"/>
  <rect x="562" y="782" width="258" height="4" rx="2" fill="#00b5d8"/>

  <text class="f" x="38" y="812" font-size="13" font-weight="800" fill="#0d2a56">Guias do MEI da equipe</text>
  <text class="f" x="38" y="833" font-size="11.5" fill="#5b6675">Emite as 14 guias de uma vez,</text>
  <text class="f" x="38" y="850" font-size="11.5" fill="#5b6675">já renomeadas por profissional.</text>
  <text class="f" x="38" y="872" font-size="11" font-weight="800" fill="#12a150">14 guias · 4 minutos</text>

  <text class="f" x="309" y="812" font-size="13" font-weight="800" fill="#0d2a56">O salão roda sem você</text>
  <text class="f" x="309" y="833" font-size="11.5" fill="#5b6675">Check list por turno, com cobrança</text>
  <text class="f" x="309" y="850" font-size="11.5" fill="#5b6675">automática de quem não fez.</text>
  <text class="f" x="309" y="872" font-size="11" font-weight="800" fill="#12a150">38 de 40 tarefas hoje</text>

  <text class="f" x="580" y="812" font-size="13" font-weight="800" fill="#0d2a56">Lucro de cada serviço</text>
  <text class="f" x="580" y="833" font-size="11.5" fill="#5b6675">Custo real, preço certo e margem</text>
  <text class="f" x="580" y="850" font-size="11.5" fill="#5b6675">calculados serviço a serviço.</text>
  <text class="f" x="580" y="872" font-size="11" font-weight="800" fill="#12a150">Escova R$ 45 · margem 62%</text>

</svg>
