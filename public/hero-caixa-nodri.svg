<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1093" width="900" height="1093" role="img" aria-label="Atendente na recepcao com a tela do caixa: comissoes e caixa do dia">
  <title>O caixa do dia fechado no NODRI</title>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafd"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="espelho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edf7"/>
    </linearGradient>
    <!-- userSpaceOnUse e obrigatorio: no padrao cada forma remapeia o gradiente
         para a propria caixa, e pescoco e cabeca saem em tons diferentes -->
    <linearGradient id="figura" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="1010">
      <stop offset="0" stop-color="#173a68"/>
      <stop offset="1" stop-color="#0c2650"/>
    </linearGradient>
    <filter id="cartao" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d2a56" flood-opacity="0.13"/>
    </filter>
    <filter id="aparelho" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d2a56" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="900" height="1093" fill="url(#fundo)"/>

  <!-- circulos fora de foco: profundidade sem pedir leitura -->
  <circle cx="716" cy="222" r="170" fill="#00b5d8" opacity="0.09"/>
  <circle cx="140" cy="806" r="128" fill="#0d2a56" opacity="0.05"/>

  <g fill="none" stroke="#00b5d8" stroke-width="6" stroke-linecap="round" opacity="0.34" transform="rotate(-8 194 232)">
    <rect x="96" y="176" width="196" height="112" rx="16"/>
    <circle cx="194" cy="232" r="30"/>
    <path d="M124 202 L134 202"/>
    <path d="M254 262 L264 262"/>
  </g>
  <rect x="0" y="1000" width="900" height="93" fill="#e3ebf5"/>
  <g transform="translate(352 1000) scale(1.05) translate(-442 -1000)">
    <g fill="url(#figura)">
      <circle cx="382" cy="458" r="27"/>
      <circle cx="442" cy="500" r="64"/>
      <path d="M420 552 L420 606 Q442 628 464 606 L464 552 Z"/>
      <path d="M348 1000 C344 790 358 690 404 634 Q422 622 442 646 Q462 622 480 634 C526 690 540 790 536 1000 Z"/>
      <path d="M470 640 Q560 646 620 690 L604 726 Q540 700 486 692 Z"/>
    </g>
  <path d="M418 616 L442 674 L466 616 L480 634 L442 706 L404 634 Z" fill="#00b5d8" opacity="0.92"/>
  <circle cx="494" cy="548" r="9" fill="none" stroke="#00b5d8" stroke-width="4"/>
  </g>
  <!-- o balcao entra depois dela: e o que da a leitura de recepcao -->
  <rect x="300" y="700" width="600" height="300" fill="url(#espelho)"/>
  <rect x="288" y="688" width="624" height="26" rx="12" fill="#ffffff"/>
  <rect x="300" y="756" width="600" height="2" fill="#0d2a56" opacity="0.06"/>

  <!-- a tela do caixa -->
  <g filter="url(#aparelho)">
    <rect x="596" y="516" width="216" height="156" rx="14" fill="#ffffff"/>
    <rect x="608" y="528" width="192" height="132" rx="8" fill="#0d2a56"/>
    <rect x="622" y="546" width="58" height="10" rx="5" fill="#00b5d8"/>
    <rect x="622" y="572" width="102" height="7" rx="3.5" fill="#ffffff" opacity="0.30"/>
    <rect x="622" y="590" width="76" height="7" rx="3.5" fill="#ffffff" opacity="0.18"/>
    <rect x="622" y="620" width="88" height="22" rx="11" fill="#00b5d8"/>
  </g>
  <path d="M578 672 L830 672 L852 688 L556 688 Z" fill="#dfe8f4"/>
  <g filter="url(#cartao)">
    <rect x="52" y="330" width="252" height="112" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="86" cy="370" r="7" fill="#00b5d8"/>
  <text x="104" y="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b80">Comiss&#245;es</text>
  <text x="84" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#0d2a56">R$ 8.240</text>
  <g filter="url(#cartao)">
    <rect x="592" y="742" width="272" height="132" rx="20" fill="#ffffff"/>
  </g>
  <text x="622" y="780" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b80">Caixa de hoje</text>
  <text x="622" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="35" font-weight="800" fill="#0d2a56">R$ 4.180</text>
  <path d="M622 852 C660 848 678 830 706 836 S776 812 834 798" fill="none" stroke="#00b5d8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="834" cy="798" r="6" fill="#00b5d8"/>
</svg>
