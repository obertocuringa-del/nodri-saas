<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1093" width="900" height="1093" role="img" aria-label="Equipe de tres profissionais: 18 de 18 tarefas do dia e meta em 112 por cento">
  <title>A equipe com as tarefas do dia em dia</title>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafd"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="espelho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edf7"/>
    </linearGradient>
    <!-- userSpaceOnUse e obrigatorio: no padrao cada forma remapeia o gradiente
         para a propria caixa, e pescoco e cabeca saem em tons diferentes -->
    <linearGradient id="figura" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="1010">
      <stop offset="0" stop-color="#173a68"/>
      <stop offset="1" stop-color="#0c2650"/>
    </linearGradient>
    <filter id="cartao" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d2a56" flood-opacity="0.13"/>
    </filter>
    <filter id="aparelho" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0d2a56" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="900" height="1093" fill="url(#fundo)"/>

  <!-- circulos fora de foco: profundidade sem pedir leitura -->
  <circle cx="716" cy="222" r="170" fill="#00b5d8" opacity="0.09"/>
  <circle cx="140" cy="806" r="128" fill="#0d2a56" opacity="0.05"/>

  <g fill="none" stroke="#00b5d8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.34">
    <rect x="112" y="126" width="160" height="186" rx="16"/>
    <rect x="162" y="110" width="58" height="30" rx="10"/>
    <path d="M146 214 L182 250 L242 178"/>
  </g>
  <rect x="0" y="1000" width="900" height="93" fill="#e3ebf5"/>
  <ellipse cx="268" cy="1000" rx="83" ry="10" fill="#0d2a56" opacity="0.09"/>
  <g transform="translate(268 1000) scale(0.8) translate(-442 -1000)">
    <g fill="url(#figura)">
      <circle cx="382" cy="458" r="27"/>
      <circle cx="442" cy="500" r="64"/>
      <path d="M420 552 L420 606 Q442 628 464 606 L464 552 Z"/>
      <path d="M348 1000 C344 790 358 690 404 634 Q422 622 442 646 Q462 622 480 634 C526 690 540 790 536 1000 Z"/>
    </g>
  <path d="M418 616 L442 674 L466 616 L480 634 L442 706 L404 634 Z" fill="#00b5d8" opacity="0.92"/>
  </g>
  <ellipse cx="612" cy="1000" rx="83" ry="10" fill="#0d2a56" opacity="0.09"/>
  <g transform="translate(612 1000) scale(0.8) translate(-442 -1000)">
    <g fill="url(#figura)">
      <circle cx="442" cy="500" r="64"/>
      <path d="M420 552 L420 606 Q442 628 464 606 L464 552 Z"/>
      <path d="M348 1000 C344 790 358 690 404 634 Q422 622 442 646 Q462 622 480 634 C526 690 540 790 536 1000 Z"/>
    </g>
  <path d="M418 616 L442 674 L466 616 L480 634 L442 706 L404 634 Z" fill="#00b5d8" opacity="0.92"/>
  </g>
  <ellipse cx="442" cy="1000" rx="99" ry="12" fill="#0d2a56" opacity="0.09"/>
  <g transform="translate(442 1000) scale(0.96) translate(-442 -1000)">
    <g fill="url(#figura)">
      <circle cx="382" cy="458" r="27"/>
      <circle cx="442" cy="500" r="64"/>
      <path d="M420 552 L420 606 Q442 628 464 606 L464 552 Z"/>
      <path d="M348 1000 C344 790 358 690 404 634 Q422 622 442 646 Q462 622 480 634 C526 690 540 790 536 1000 Z"/>
    </g>
  <path d="M418 616 L442 674 L466 616 L480 634 L442 706 L404 634 Z" fill="#00b5d8" opacity="0.92"/>
  </g>
  <g filter="url(#cartao)">
    <rect x="52" y="330" width="252" height="112" rx="20" fill="#ffffff"/>
  </g>
  <circle cx="86" cy="370" r="7" fill="#00b5d8"/>
  <text x="104" y="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b80">Tarefas do dia</text>
  <text x="84" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#0d2a56">18 de 18</text>
  <g filter="url(#cartao)">
    <rect x="592" y="742" width="272" height="132" rx="20" fill="#ffffff"/>
  </g>
  <text x="622" y="780" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5c6b80">Meta da equipe</text>
  <text x="622" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="35" font-weight="800" fill="#0d2a56">112%</text>
  <rect x="622" y="844" width="212" height="9" rx="5" fill="#e2e9f2"/>
  <rect x="622" y="844" width="212" height="9" rx="5" fill="#00b5d8"/>
</svg>
