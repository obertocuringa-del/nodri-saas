<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>NODRI — Feedback Avec</title>
<style>
  body { font: 13px system-ui, sans-serif; color: #1a1a1a; background: #fdfcfa; margin: 0; padding: 24px; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { color: #8f877f; margin: 0 0 18px; font-size: 12px; }
  label { display: block; font-weight: 700; font-size: 11.5px; color: #6b6860; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #e8e6e0; border-radius: 8px; background: #fff; font: inherit; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 8px; background: #1a1a1a; color: #fff; font-weight: 700; cursor: pointer; }
  button.secundario { background: #f0ece7; color: #1a1a1a; margin-left: 8px; }
  #aviso { margin-top: 12px; font-size: 12px; color: #2f6b4f; }
  #saude { margin-top: 18px; padding: 10px 12px; border-radius: 10px; background: #f7f5f0; font-size: 12px; white-space: pre-line; color: #6b6860; }
  .nota { font-size: 11.5px; color: #8f877f; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>NODRI — Feedback Avec</h1>
  <p class="sub">Esta extensão lê o relatório do Avec e avisa o NODRI quem pagou hoje. Quem manda a mensagem é o CRM do NODRI.</p>

  <label>Chave da extensão (copie em NODRI › CRM › Configurar › Automação de feedback)</label>
  <input id="chave" autocomplete="off" spellcheck="false">

  <label>E-mail do Avec</label>
  <input id="email" type="email" autocomplete="off">
  <label>Senha do Avec</label>
  <input id="senha" type="password" autocomplete="new-password">
  <p class="nota">Usados só se o Avec deslogar. Ficam neste computador, dentro do Chrome. Não vão para o NODRI.</p>

  <button id="salvar">Salvar</button>
  <button id="testar" class="secundario">Rodar um ciclo agora</button>
  <div id="aviso"></div>
  <div id="saude">—</div>
</main>
<script src="opcoes.js"></script>
</body>
</html>
